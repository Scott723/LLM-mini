[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "myqwen"
version = "0.1.0"
description = "A from-scratch, configurable decoder-only language model implementation."
requires-python = ">=3.8"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]